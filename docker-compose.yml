version: "3.8"

services:
  # MongoDB Database
  mongo:
    image: mongo:7
    container_name: smart-leads-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db  # Persist data even after container restart
    environment:
      MONGO_INITDB_DATABASE: smart-leads

  # Backend API
  backend:
    build: ./backend
    container_name: smart-leads-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongo  # Start mongo first
    env_file:
      - ./backend/.env        # Load secrets from .env file (never hardcode!)
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/smart-leads  # Override URI to point to Docker mongo
      NODE_ENV: production
      CLIENT_URL: http://localhost:3000

  # Frontend
  frontend:
    build: ./frontend
    container_name: smart-leads-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data: